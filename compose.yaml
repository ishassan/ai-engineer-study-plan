name: assistant

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      args:
        UV_GROUPS: "${UV_GROUPS:-}"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      MCP_SQL_URL: http://mcp-sql:8091/mcp
      MCP_CATALOGUE_URL: http://mcp-catalogue:8092/mcp
      # Phase 5: the signing keys of Keycloak inside the Docker network (the issuer of the
      # tokens stays http://localhost:8180/realms/lab), and the guardrails server.
      AUTH_METADATA_URL: http://keycloak:8080/realms/lab/.well-known/openid-configuration
      GUARDRAILS_URL: http://guardrails:8000
      # Phase 6: the model gateway inside the Docker network.
      GATEWAY_URL: http://gateway:4000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn assistant.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir assistant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Phase 2: Hugging Face Text Embeddings Inference serves the embedding model and the
  # re-ranking model on the CPU. The default image is for Apple Silicon. On an Intel or AMD
  # machine, set TEI_TAG=cpu-1.9.4 in .env. The first start downloads each model (2.3 GB)
  # into its volume. Both models accept 8192 tokens, and at the start the server tests one
  # input of the maximum length, which needs about 10 GB of memory. The limit of 2048 tokens
  # keeps each service near 3 GB. Longer inputs are cut at 2048 tokens.
  # EMBEDDINGS_MODEL_VOLUME and RERANKER_MODEL_VOLUME can name a folder in place of the volume.
  # The CI workflow of Phase 3 uses this to keep the model files in its cache.
  embeddings:
    profiles: ["phase2"]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-arm64-1.9.4}
    command:
      - --model-id=BAAI/bge-m3
      - --revision=5617a9f61b028005a4858fdac845db406aefb181
      - --max-batch-tokens=2048
    ports:
      - "127.0.0.1:${EMBEDDINGS_PORT:-8081}:80"
    volumes:
      - ${EMBEDDINGS_MODEL_VOLUME:-embeddings-model}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
      start_interval: 5s

  reranker:
    profiles: ["phase2"]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-arm64-1.9.4}
    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --revision=953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
      - --max-batch-tokens=2048
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8082}:80"
    volumes:
      - ${RERANKER_MODEL_VOLUME:-reranker-model}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
      start_interval: 5s

  # Phase 3: self-hosted Langfuse for the traces, the datasets and the scores.
  # Source: docker-compose.yml of Langfuse release v4.80.0
  # (https://github.com/langfuse/langfuse/blob/v4.80.0/docker-compose.yml).
  # Changes for the lab:
  # - The service names start with "langfuse-", so they do not clash with `db` and `api`.
  # - Only the web UI (3000) and MinIO (9090, for media uploads from the browser) have a port
  #   on your machine, and both bind to 127.0.0.1. The databases have no port on your machine.
  # - The settings are fixed values and not ${...} variables, because Compose reads .env and
  #   names such as DATABASE_URL already mean the database of the assistant.
  # - Headless initialisation: the first start creates an organisation, a project, a user and
  #   the API keys of .env.example, so no click in the UI is necessary.
  # - Telemetry to Langfuse is off. No `restart: always`. The AI gateway is not included,
  #   because the lab does not use it.
  # The passwords are for a service that only your machine can reach. Change them before you
  # run Langfuse anywhere else.
  langfuse-worker:
    profiles: ["phase3"]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.80.0
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      DATABASE_URL: postgresql://postgres:langfuse@langfuse-postgres:5432/postgres
      SALT: lab-salt-change-me
      ENCRYPTION_KEY: 07e5376a357213a1ea22563a24c9799dba10697ab41437eb03e13e16124e8451
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: myredissecret
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    profiles: ["phase3"]
    image: docker.langfuse.com/langfuse/langfuse:4.80.0
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: lab-nextauth-secret-change-me
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Headless initialisation. Do not put quotes around these values.
      LANGFUSE_INIT_ORG_ID: lab
      LANGFUSE_INIT_ORG_NAME: Lab
      LANGFUSE_INIT_PROJECT_ID: assistant
      LANGFUSE_INIT_PROJECT_NAME: assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-lab}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-lab}
      LANGFUSE_INIT_USER_EMAIL: lab@example.com
      LANGFUSE_INIT_USER_NAME: Lab
      LANGFUSE_INIT_USER_PASSWORD: lab-password
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3000/api/public/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 5s

  langfuse-clickhouse:
    profiles: ["phase3"]
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    profiles: ["phase3"]
    # The publisher gives this image only with the tag "latest". The digest pins one build.
    image: cgr.dev/chainguard/minio@sha256:634c989a2f1029162fc2676c263caa181213b9410449968532f750a6fb77532d
    entrypoint: sh
    # Create the bucket "langfuse" before the server starts.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    profiles: ["phase3"]
    image: docker.io/redis:7.4.12
    command: >
      --requirepass myredissecret
      --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    profiles: ["phase3"]
    image: docker.io/postgres:17.12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Phase 4, week 16: the two MCP tool servers of assistant/servers/, with the image of the API.
  # Each one serves streamable HTTP on /mcp. The source folder is mounted, so a change of your
  # code needs only a restart: docker compose restart mcp-sql mcp-catalogue
  mcp-sql:
    profiles: ["phase4"]
    build:
      context: .
      args:
        UV_GROUPS: "${UV_GROUPS:-}"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8091"
      # The read-only role of your migration. SQL_ROW_LIMIT and SQL_TIMEOUT_SECONDS can go here.
      SQL_DATABASE_URL: postgresql://assistant_reader:assistant_reader@db:5432/assistant
      # Phase 5, week 19: the signing keys of Keycloak inside the Docker network.
      AUTH_METADATA_URL: http://keycloak:8080/realms/lab/.well-known/openid-configuration
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m assistant.servers.sql_server

  mcp-catalogue:
    profiles: ["phase4"]
    build:
      context: .
      args:
        UV_GROUPS: "${UV_GROUPS:-}"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8092"
      DATABASE_URL: postgresql://assistant:assistant@db:5432/assistant
      # Phase 5, week 19: the signing keys of Keycloak inside the Docker network.
      AUTH_METADATA_URL: http://keycloak:8080/realms/lab/.well-known/openid-configuration
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m assistant.servers.catalogue_server

  # Phase 5, week 19: Keycloak, the authorization server. At each start it imports the realm
  # `lab` of keycloak/realm-lab.json (a realm that exists is kept), so no click in the console
  # is necessary. The realm has the clients `assistant-cli` (the lab scripts, password grant)
  # and `assistant-service` (the evaluation jobs, client credentials grant), the scope
  # `mcp:tools`, and three test users: viewer, analyst (group analysts) and auditor (group
  # auditors). The token of a user holds the audiences assistant-api, mcp-sql and mcp-catalogue
  # and the claim `groups`.
  # Dev mode keeps the data in the container only. The passwords are for a service that only
  # your machine can reach.
  keycloak:
    profiles: ["phase5"]
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-password
      # The issuer of each token is http://localhost:8180/realms/lab, also for a request that
      # comes from another container (http://keycloak:8080). The servers in Docker read the
      # signing keys through that address.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: bash opens the connection to the management port itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3m
      start_interval: 3s

  # Phase 5, week 20: the NeMo Guardrails server, with the configuration of guardrails/config/.
  # NVIDIA publishes no image of the server, so Compose builds one from guardrails/Dockerfile
  # (the pinned package of PyPI; it builds on Apple Silicon and on Intel or AMD). The API calls
  # POST /v1/checks before and after the agent. The first start downloads the model of the
  # jailbreak heuristics (gpt2-large, about 3.2 GB) into the volume. All rails run on the CPU
  # and call no model service. GUARDRAILS_MODEL_VOLUME can name a folder in place of the volume.
  guardrails:
    profiles: ["phase5"]
    build: ./guardrails
    image: assistant-guardrails:0.24.1
    ports:
      - "127.0.0.1:${GUARDRAILS_PORT:-8100}:8000"
    volumes:
      - ./guardrails/config:/config:ro
      - ${GUARDRAILS_MODEL_VOLUME:-guardrails-models}:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
      start_interval: 5s

  # Phase 6, week 21: the LiteLLM proxy, the model gateway. Each model call of the assistant goes
  # to it, and it sends the call to the provider of the model: Claude, OpenAI, or vLLM on your
  # rented GPU. Your routes, fallbacks and budgets are in gateway/config.yaml (`make start
  # PHASE=6` copies it). The provider keys come from .env. The api service reads the same file,
  # so it has the keys too: the calls go through the gateway only because your code sends them there.
  # The gateway keeps its virtual keys, budgets and spend in the database `litellm` of the
  # Postgres service. Prisma does not create a database, so `gateway-db` creates it first.
  # The admin UI is on http://localhost:4000/ui (user admin, password LITELLM_MASTER_KEY).
  gateway-db:
    profiles: ["phase6"]
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      PGPASSWORD: assistant
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        psql -h db -U assistant -d assistant -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1
        || psql -h db -U assistant -d assistant -c "CREATE DATABASE litellm"

  gateway:
    profiles: ["phase6"]
    image: ghcr.io/berriai/litellm:v1.109.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://assistant:assistant@db:5432/litellm
      # The key of the admin API and of the admin UI. The assistant uses a virtual key (GATEWAY_KEY).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-lab-gateway-master}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-lab-gateway-salt}
      # The prices of the models are in gateway/config.yaml. This setting stops the download of
      # the price list of LiteLLM at each start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Weeks 22 to 25: the address of vLLM on your pod (https://<pod id>-8000.proxy.runpod.net/v1)
      # and the key that you gave vLLM with --api-key.
      VLLM_API_BASE: ${VLLM_API_BASE:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    # Week 23, optional step: llama.cpp runs on your Mac, outside Docker. The gateway reaches it
    # at http://host.docker.internal:<port>. This line gives the same name on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3m
      start_interval: 3s

volumes:
  db-data:
  embeddings-model:
  reranker-model:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  guardrails-models:
