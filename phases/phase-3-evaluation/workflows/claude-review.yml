# Optional: a review of each pull request by the Claude Code GitHub Action. Week 11.
#
# This file is not copied by `make start`. To use it:
# 1. Install the Claude GitHub App on your repository: https://github.com/apps/claude
# 2. Run `claude setup-token` on your machine. It makes an OAuth token for your Claude
#    subscription. Add it as the secret CLAUDE_CODE_OAUTH_TOKEN of the repository.
# 3. Copy this file to .github/workflows/claude-review.yml.
#
# The review runs on your subscription, not on API credit.
# Source: https://code.claude.com/docs/en/github-actions.md
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
