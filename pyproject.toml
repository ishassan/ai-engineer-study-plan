[project]
name = "data-platform-assistant"
version = "0.1.0"
description = "A data platform assistant: the project of the AI engineer study plan."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.162,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q -p labkit.plugin"
markers = [
    "live: the check calls the real Claude API and costs money",
]
