[project]
name = "data-platform-assistant"
version = "0.1.0"
description = "A data platform assistant: the project of the AI engineer study plan."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.162,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

# One group for each phase. `make start PHASE=n` turns the group of the phase on.
phase1 = []
phase2 = [
    "httpx>=0.28,<1",
    "pymupdf>=2.1,<3",
]
phase3 = [
    "langfuse>=5.2,<6",
]
phase4 = [
    "langchain-anthropic>=1.7.10,<2",
    "langchain-core>=1.8,<2",
    "langchain-openai>=1.8,<2",
    "langgraph>=1.2.22,<2",
    # Week 15: the checkpointer and the store in Postgres.
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "psycopg-pool>=3.3,<4",
    # Week 16: the MCP servers and the client of the graph. langchain-mcp-adapters 0.3
    # needs mcp below 2.
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "mcp>=1.30,<2",
]
phase5 = [
    # Week 19: the API and the MCP servers check the signature of each access token (RS256).
    "pyjwt[crypto]>=2.15,<3",
]
phase6 = [
    # Week 21: the checks read gateway/config.yaml.
    "pyyaml>=6.0,<7",
]
phase7 = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q -p labkit.plugin"
markers = [
    "live: the check calls the real Claude API and costs money",
]
